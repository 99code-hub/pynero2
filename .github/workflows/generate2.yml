name: Build Pynero for Fedora

on:
  workflow_dispatch:

jobs:
  build-fedora:
    runs-on: ubuntu-22.04
    container:
      image: fedora:40

    steps:
      - name: Install Fedora Dependencies
        run: |
          dnf install -y git gcc-c++ make libtool automake autoconf pkgconfig \
            fmt-devel libevent-devel boost-devel libdb-cxx-devel bzip2 openssl-devel \
            which procps-ng

      - name: Clone Base Codebase
        run: |
          git clone --depth 1 --branch v0.21.2.2 https://github.com/litecoin-project/litecoin.git pynero

      - name: Rebrand Codebase & Fix Headers for GCC 14
        run: |
          cd pynero

          # Fix GCC 14 missing <stdexcept> include in support/lockedpool.cpp
          sed -i '1s/^/#include <stdexcept>\n/' src/support/lockedpool.cpp

          # Rename physical files containing LTC, Litecoin, or litecoin
          find . -depth -name '*LTC*' | while read f; do mv "$f" "${f//LTC/PYN}"; done
          find . -depth -name '*Litecoin*' | while read f; do mv "$f" "${f//Litecoin/Pynero}"; done
          find . -depth -name '*litecoin*' | while read f; do mv "$f" "${f//litecoin/pynero}"; done

          # Rebrand text references
          find . -type f \( -name "*.cpp" -o -name "*.h" -o -name "*.am" -o -name "*.ac" -o -name "*.txt" \) -exec sed -i 's/Litecoin/Pynero/g' {} +
          find . -type f \( -name "*.cpp" -o -name "*.h" -o -name "*.am" -o -name "*.ac" -o -name "*.txt" \) -exec sed -i 's/litecoin/pynero/g' {} +
          find . -type f \( -name "*.cpp" -o -name "*.h" -o -name "*.am" -o -name "*.ac" -o -name "*.txt" \) -exec sed -i 's/LTC/PYN/g' {} +

      - name: Isolate Pynero Network Parameters
        run: |
          cd pynero/src
          sed -i 's/nDefaultPort = 9333/nDefaultPort = 19333/g' chainparams.cpp || true
          sed -i 's/8333/19333/g' chainparams.cpp
          sed -i 's/8332/19332/g' chainparams.cpp
          sed -i 's/0xfb, 0xc0, 0xb6, 0xdb/0xfc, 0xd2, 0xb4, 0xe5/g' chainparams.cpp
          sed -i '/vSeeds.emplace_back/d' chainparams.cpp
          sed -i '/vSeeds.push_back/d' chainparams.cpp
          sed -i 's/defaultAssumeValid = .*/defaultAssumeValid = uint256();/g' chainparams.cpp

      - name: Build Pynero Binaries for Fedora
        run: |
          cd pynero
          ./autogen.sh
          ./configure --with-incompatible-bdb --disable-tests --disable-bench
          make -j$(nproc)

      - name: Upload Fedora Binaries
        uses: actions/upload-artifact@v4
        with:
          name: pynero-fedora-binaries
          path: |
            pynero/src/pynerod
            pynero/src/pynero-cli

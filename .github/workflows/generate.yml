name: Build Pynero Blockchain

on:
  workflow_dispatch:

jobs:
  build-pynero:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libtool autotools-dev automake pkg-config \
            bsdmainutils python3 libevent-dev libboost-system-dev libboost-filesystem-dev \
            libboost-test-dev libboost-thread-dev libsqlite3-dev libdb++-dev libfmt-dev

      - name: Clone Base Codebase
        run: |
          git clone --depth 1 --branch v0.21.2.2 https://github.com/litecoin-project/litecoin.git pynero

      - name: Rebrand Codebase to Pynero
        run: |
          cd pynero
          find . -type f \( -name "*.cpp" -o -name "*.h" -o -name "*.am" -o -name "*.ac" \) -exec sed -i 's/Litecoin/Pynero/g' {} +
          find . -type f \( -name "*.cpp" -o -name "*.h" -o -name "*.am" -o -name "*.ac" \) -exec sed -i 's/litecoin/pynero/g' {} +
          find . -type f \( -name "*.cpp" -o -name "*.h" -o -name "*.am" -o -name "*.ac" \) -exec sed -i 's/LTC/PYN/g' {} +

      - name: Build Pynero Software
        run: |
          cd pynero
          ./autogen.sh
          ./configure --with-incompatible-bdb --disable-tests --disable-bench
          make -j$(nproc)

      - name: Upload Pynero Executables
        uses: actions/upload-artifact@v4
        with:
          name: pynero-linux-binaries
          path: |
            pynero/src/pynerod
            pynero/src/pynero-cli

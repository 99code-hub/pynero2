name: Build for Ubuntu 24.04

on:
  workflow_dispatch:

jobs:
  build-pynero:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install All Required Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libtool autotools-dev automake pkg-config \
            bsdmainutils python3 cmake libfmt-dev libevent-dev libboost-system-dev \
            libboost-filesystem-dev libboost-test-dev libboost-thread-dev libsqlite3-dev \
            libdb++-dev libminiupnpc-dev libnatpmp-dev libzmq3-dev

      - name: Clone Base Codebase
        run: |
          git clone --depth 1 --branch v0.21.2.2 https://github.com/litecoin-project/litecoin.git pynero

      - name: Rebrand Codebase & Rename Disk Files
        run: |
          cd pynero

          # 1. Rename physical files containing LTC, Litecoin, or litecoin on disk
          find . -depth -name '*LTC*' | while read f; do mv "$f" "${f//LTC/PYN}"; done
          find . -depth -name '*Litecoin*' | while read f; do mv "$f" "${f//Litecoin/Pynero}"; done
          find . -depth -name '*litecoin*' | while read f; do mv "$f" "${f//litecoin/pynero}"; done

          # 2. Rebrand text references across all source, build, python, and configuration files
          find . -type f \( -name "*.cpp" -o -name "*.h" -o -name "*.am" -o -name "*.ac" -o -name "*.txt" -o -name "*.m4" -o -name "*.py" \) -exec sed -i 's/Litecoin/Pynero/g' {} +
          find . -type f \( -name "*.cpp" -o -name "*.h" -o -name "*.am" -o -name "*.ac" -o -name "*.txt" -o -name "*.m4" -o -name "*.py" \) -exec sed -i 's/litecoin/pynero/g' {} +
          find . -type f \( -name "*.cpp" -o -name "*.h" -o -name "*.am" -o -name "*.ac" -o -name "*.txt" -o -name "*.m4" -o -name "*.py" \) -exec sed -i 's/LTC/PYN/g' {} +

      - name: Isolate Pynero Network Parameters
        run: |
          cd pynero/src
          sed -i 's/nDefaultPort = 9333/nDefaultPort = 19333/g' chainparams.cpp || true
          sed -i 's/8333/19333/g' chainparams.cpp
          sed -i 's/8332/19332/g' chainparams.cpp
          sed -i 's/0xfb, 0xc0, 0xb6, 0xdb/0xfc, 0xd2, 0xb4, 0xe5/g' chainparams.cpp
          sed -i '/vSeeds.emplace_back/d' chainparams.cpp
          sed -i '/vSeeds.push_back/d' chainparams.cpp
          sed -i 's/defaultAssumeValid = .*/defaultAssumeValid = uint256();/g' chainparams.cpp

      - name: Build Pynero Software
        run: |
          cd pynero
          ./autogen.sh

          # Force global injection of standard C++ headers removed from transitive inclusion in GCC 13+
          # Suppress GCC 13 compiler warnings that halt modern builds
          ./configure --with-incompatible-bdb --disable-tests --disable-bench --with-gui=no \
            CXXFLAGS="-include cstdint -include stdexcept -include cstddef -include string -include memory -Wno-dangling-reference -Wno-subobject-linkage -Wno-array-bounds -O2" \
            CFLAGS="-include cstdint -include stdexcept -include cstddef -O2"

          make -j$(nproc)

      - name: Verify Compiled Binaries Exists
        run: |
          test -f pynero/src/pynerod || (echo "Error: pynerod binary not found!" && exit 1)
          test -f pynero/src/pynero-cli || (echo "Error: pynero-cli binary not found!" && exit 1)

      - name: Upload Pynero Binaries
        uses: actions/upload-artifact@v4
        with:
          name: pynero-ubuntu24-binaries
          path: |
            pynero/src/pynerod
            pynero/src/pynero-cli
